<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="tp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="100%" stop-color="#14182e" />
    </linearGradient>
    <linearGradient id="tp-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="tp-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="tp-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#tp-bg)" stroke="url(#tp-border)" stroke-width="2.5" />

  <!-- Ambient Audio Spectrum EQ Bars (Left) -->
  <rect x="12" y="27" width="3" height="10" rx="1.5" fill="#00f2fe" opacity="0.6" />
  <rect x="18" y="22" width="3" height="20" rx="1.5" fill="#38bdf8" opacity="0.8" />

  <!-- Ambient Audio Spectrum EQ Bars (Right) -->
  <rect x="43" y="22" width="3" height="20" rx="1.5" fill="#a855f7" opacity="0.8" />
  <rect x="49" y="27" width="3" height="10" rx="1.5" fill="#ec4899" opacity="0.6" />

  <!-- Central Dynamic Pulse / Telemetry Heartbeat Waveform -->
  <path d="M12 32 H21 L25 18 L32 46 L38 24 L42 32 H52" 
        stroke="url(#tp-pulse)" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#tp-glow)" />

  <!-- Central Neural Intelligence Core Nodes -->
  <circle cx="32" cy="46" r="2.5" fill="#00f2fe" filter="url(#tp-glow)" />
  <circle cx="25" cy="18" r="2.5" fill="#38bdf8" filter="url(#tp-glow)" />
  <circle cx="38" cy="24" r="2.5" fill="#ec4899" filter="url(#tp-glow)" />
</svg>

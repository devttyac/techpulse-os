name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHON_DOTENV_DISABLED: '1'
      GEMINI_API_KEY: ''
      API_SECRET_KEY: ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax & PyCompile Check
        run: |
          python -m py_compile src/main.py src/ingestion.py src/synthesizer.py src/tts_engine.py src/grounded_chat.py src/provenance.py src/content_availability.py src/story_manifest.py src/state_store.py src/operations.py src/settings.py src/run_coordinator.py src/evidence_contracts.py src/evidence_store.py src/legacy_reader.py src/lifecycle.py src/acquisition/readiness.py

      - name: Run Complete Source Contract Tests
        run: python tests/test_evidence_contracts.py

      - name: Run Complete Source Store Tests
        run: python tests/test_evidence_store.py

      - name: Run Source Readiness Policy Tests
        run: python tests/test_source_readiness.py

      - name: Run Retained Episode Reader Tests
        run: python tests/test_legacy_reader.py

      - name: Run Retained Cohort Tests
        run: python tests/test_retained_cohorts.py

      - name: Run State Store Tests
        run: python tests/test_state_store.py

      - name: Run Retained Lifecycle Tests
        run: python tests/test_lifecycle.py

      - name: Run Settings Tests
        run: python tests/test_settings.py

      - name: Run Coordinator Tests
        run: python tests/test_run_coordinator.py

      - name: Run Operation Repository Tests
        run: python tests/test_operations.py

      - name: Run Story Alignment Tests
        run: python tests/test_story_alignment.py

      - name: Run Synthesizer Unit Tests
        run: |
          python tests/test_synthesizer.py

      - name: Run Escaping Unit Tests
        run: |
          python tests/test_escaping.py

      - name: Run Auth Unit Tests
        run: |
          python tests/test_auth.py

      - name: Run URL Provenance Unit Tests
        run: |
          python tests/test_url_provenance.py

      - name: Run ASGI Endpoint Test Suite
        run: |
          python tests/test_endpoints.py

      - name: Run Provenance Collector Tests
        run: python tests/test_run_provenance.py

      - name: Run Pipeline Audit Tests
        run: python tests/test_pipeline_audit.py

      - name: Run Empty Domain and Source Health Tests
        run: |
          python tests/test_empty_domains.py
          python tests/test_source_health.py

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Frontend Provenance Tests
        run: node --test tests/test_frontend_provenance.mjs

      - name: Run Frontend Empty Domain Tests
        run: node --test tests/test_frontend_empty_domains.mjs

      - name: Run Frontend Settings Tests
        run: node --test tests/test_frontend_settings.mjs

      - name: Build Docker Image
        run: docker build --tag techpulse-ci:${{ github.sha }} .
